info:
  name: Create Trail
  type: http
  seq: 13

http:
  method: POST
  url: http://localhost:3000/admin/trails
  body:
    type: form-urlencoded
    data:
      - name: title
        value: testBruno
      - name: region_id
        value: "4"
      - name: difficulty
        value: easy
      - name: distance_km
        value: "7"
      - name: description
        value: testBruno
      - name: image_url
        value: X
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
